<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Template Matcher</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .sub { color: #666; margin-top: 0; margin-bottom: 28px; }
  section { border: 1px solid #e2e2e2; border-radius: 10px; padding: 20px; margin-bottom: 24px; }
  h2 { font-size: 1.05rem; margin-top: 0; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=file], input[type=number] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 14px; padding: 9px 16px; border: none; background: #1a1a1a; color: white; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #333; }
  .result { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .bar-bg { background: #f0f0f0; border-radius: 4px; height: 8px; margin-top: 6px; overflow: hidden; }
  .bar-fill { background: #1a1a1a; height: 100%; }
  .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background: #eee; margin-left: 6px; }
  #templateList .result { display: flex; justify-content: space-between; align-items: center; }
  .muted { color: #888; font-size: 0.8rem; }
  .del { background: #b00020; padding: 4px 10px; font-size: 0.75rem; }
</style>
</head>
<body>
  <h1>📄 Document Template Matcher</h1>
  <p class="sub">Upload template files, then check how new documents match against them (semantic similarity).</p>

  <section>
    <h2>1. Add a Template</h2>
    <label>Template name</label>
    <input type="text" id="tplName" placeholder="e.g. Invoice Template A">
    <label>Category (optional)</label>
    <input type="text" id="tplCategory" placeholder="e.g. Finance">
    <label>File (.pdf, .docx, .txt, .png, .jpg)</label>
    <input type="file" id="tplFile">
    <button onclick="uploadTemplate()">Upload Template</button>
    <div id="tplStatus" class="muted"></div>
  </section>

  <section>
    <h2>2. Stored Templates</h2>
    <button onclick="loadTemplates()">Refresh List</button>
    <div id="templateList"></div>
  </section>

  <section>
    <h2>3. Match a Document</h2>
    <label>File to check</label>
    <input type="file" id="matchFile">
    <button onclick="matchDocument()">Find Matching Templates</button>
    <div id="matchResults"></div>
  </section>

<script>
const API = ""; // same origin

async function uploadTemplate() {
  const name = document.getElementById('tplName').value.trim();
  const category = document.getElementById('tplCategory').value.trim();
  const fileInput = document.getElementById('tplFile');
  const status = document.getElementById('tplStatus');
  if (!name || !fileInput.files[0]) { status.textContent = "Name and file are required."; return; }

  const form = new FormData();
  form.append("file", fileInput.files[0]);
  form.append("name", name);
  if (category) form.append("category", category);

  status.textContent = "Uploading...";
  try {
    const res = await fetch(`${API}/api/templates`, { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json()).detail || "Upload failed");
    status.textContent = "✅ Template added.";
    loadTemplates();
  } catch (e) {
    status.textContent = "❌ " + e.message;
  }
}

async function loadTemplates() {
  const list = document.getElementById('templateList');
  list.innerHTML = "Loading...";
  const res = await fetch(`${API}/api/templates`);
  const data = await res.json();
  if (data.length === 0) { list.innerHTML = "<p class='muted'>No templates yet.</p>"; return; }
  list.innerHTML = "";
  data.forEach(t => {
    const div = document.createElement('div');
    div.className = "result";
    div.innerHTML = `
      <div>
        <strong>${t.name}</strong> ${t.category ? `<span class="badge">${t.category}</span>` : ""}
        <div class="muted">${t.filename} · #${t.id}</div>
      </div>
      <button class="del" onclick="deleteTemplate(${t.id})">Delete</button>
    `;
    list.appendChild(div);
  });
}

async function deleteTemplate(id) {
  await fetch(`${API}/api/templates/${id}`, { method: "DELETE" });
  loadTemplates();
}

async function matchDocument() {
  const fileInput = document.getElementById('matchFile');
  const resultsDiv = document.getElementById('matchResults');
  if (!fileInput.files[0]) { resultsDiv.innerHTML = "<p class='muted'>Choose a file first.</p>"; return; }

  const form = new FormData();
  form.append("file", fileInput.files[0]);

  resultsDiv.innerHTML = "Matching...";
  try {
    const res = await fetch(`${API}/api/match`, { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json()).detail || "Match failed");
    const data = await res.json();

    let html = `<p class="muted">Extraction method: ${data.extraction_method}</p>`;
    if (data.top_matches.length === 0) {
      html += "<p class='muted'>No templates stored yet to compare against.</p>";
    }
    data.top_matches.forEach(m => {
      const pct = Math.round(m.similarity_score * 100);
      html += `
        <div class="result">
          <strong>${m.name}</strong> <span class="badge">${m.confidence_label}</span>
          <div class="muted">${pct}% similarity</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>`;
    });
    resultsDiv.innerHTML = html;
  } catch (e) {
    resultsDiv.innerHTML = "❌ " + e.message;
  }
}

loadTemplates();
</script>
</body>
</html>
